version: '3'

services:
  lavinmq:
    image: docker.io/cloudamqp/lavinmq:latest@sha256:2d92aa41dda178e18ed1d64d3b48af47273a4c2134e82f61fcbc112797c378a9
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - lavinmq:/var/lib/lavinmq

  postgres:
    image: docker.io/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    healthcheck:
     test: ["CMD", "sh", "-c", "pg_isready -U $$POSTGRES_USER -h $$(hostname -i)"]
     interval: 5s
     retries: 3
    env_file: database.env
    ports:
      - 5432:5432
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - postgres:/var/lib/postgresql/data

  gateway-store:
    image: docker.io/library/postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    healthcheck:
     test: ["CMD", "sh", "-c", "pg_isready -U $$POSTGRES_USER -h $$(hostname -i)"]
     interval: 5s
     retries: 3
    env_file: gateway-store.env
    ports:
      - 5433:5432
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - gw-store:/var/lib/postgresql/data

  gateway:
    image: ghcr.io/nezuchan/kanao-gateway:latest-dev@sha256:3c7082bac2a29caf926d73206661074011f78eff075a23d654e8a96e524efd61
    env_file:
      - gateway.env
      - gateway-store.env
      - token.env
    depends_on:
      gateway-store: { condition: service_healthy }

  gateway-cache:
    image: ghcr.io/nezuchan/kanao-cache:latest-dev@sha256:fde42635458493263cacad85ce0de1408e0c4fa34a0d4e35904838113360a31c
    deploy:
      replicas: 1
    env_file:
      - gateway.env
      - token.env
      - gateway-store.env
    depends_on:
      gateway-store: { condition: service_healthy }
    restart: unless-stopped

volumes:
  lavinmq:
  postgres:
  gw-store:
