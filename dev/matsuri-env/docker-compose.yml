version: '3'

services:
  lavinmq:
    image: docker.io/cloudamqp/lavinmq:latest
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - lavinmq:/var/lib/lavinmq

  postgres:
    image: docker.io/library/postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    healthcheck:
     test: ["CMD", "sh", "-c", "pg_isready -U $$POSTGRES_USER -h $$(hostname -i)"]
     interval: 5s
     retries: 3
    env_file: database.env
    ports:
      - 5432:5432
    deploy:
      resources:
        limits:
          memory: 512M
    volumes:
      - postgres:/var/lib/postgresql/data

  gateway-store:
    image: docker.io/library/postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
    healthcheck:
     test: ["CMD", "sh", "-c", "pg_isready -U $$POSTGRES_USER -h $$(hostname -i)"]
     interval: 5s
     retries: 3
    env_file: gateway-store.env
    ports:
      - 5433:5432
    deploy:
      resources:
        limits:
          memory: 1G
    volumes:
      - gw-store:/var/lib/postgresql/data

  gateway:
    image: ghcr.io/nezuchan/kanao-gateway:latest-dev
    env_file:
      - gateway.env
      - gateway-store.env
      - token.env
    depends_on:
      gateway-store: { condition: service_healthy }

  gateway-cache:
    image: ghcr.io/nezuchan/kanao-cache:latest-dev
    deploy:
      replicas: 1
    env_file:
      - gateway.env
      - token.env
      - gateway-store.env
    depends_on:
      gateway-store: { condition: service_healthy }
    restart: unless-stopped

volumes:
  lavinmq:
  postgres:
  gw-store:
